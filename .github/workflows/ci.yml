name: CI/CD

on:
  push:
    branches: [ main, develop ]

  pull_request:

  workflow_dispatch:

permissions:
  contents:      write
  packages:      write
  issues:        write
  pull-requests: write

jobs:
  pipeline:
    uses: DasRed/github-workflows/.github/workflows/node-docker.yml@v1
    secrets:
      dockhand-token: ${{ secrets.DOCKHAND_TOKEN }}
    with:
      dockhand-environment: chronos
