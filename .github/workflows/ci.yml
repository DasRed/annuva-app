name: CI/CD

on:
  push:
    branches: [ main, develop ]

  pull_request:

  workflow_dispatch:

permissions:
  contents:      write
  packages:      write
  issues:        write
  pull-requests: write

jobs:
  pipeline:
    uses: DasRed/github-workflows/.github/workflows/node-docker.yml@v2
    secrets:
      dockhand-host: ${{ secrets.DOCKHAND_HOST }}
      dockhand-token: ${{ secrets.DOCKHAND_TOKEN }}
      homeassistant-webhook-url: ${{ secrets.HOMEASSISTANT_WEBHOOK_URL }}
    with:
      environment: chronos

  # The reusable pipeline deploys a single container only, so the demo instance is updated here.
  # Runs only when the pipeline created a release and published a new image.
  deploy-demo:
    name:    Deploy Demo via Dockhand
    runs-on: ubuntu-26.04
    needs:   pipeline

    permissions: { }

    if: needs.pipeline.outputs.released == 'true'

    steps:
      - name: Update Container
        uses: DasRed/github-workflows/.github/actions/dockhand-update@v2
        with:
          host:           ${{ secrets.DOCKHAND_HOST }}
          environment:    chronos
          container_name: annuva-demo
          image:          ghcr.io/dasred/annuva-app:latest
          token:          ${{ secrets.DOCKHAND_TOKEN }}
